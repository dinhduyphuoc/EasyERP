services:
  db:
    env_file:
      - ./.env.dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    env_file:
      - ./.env.dev
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./.env.dev
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_PROFILE: development
      DATABASE_DEVELOPMENT_URL: "postgresql://${POSTGRES_USER:-username}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-store}?schema=public"
      DATABASE_DEVELOPMENT_SHADOW_URL: "postgresql://${POSTGRES_USER:-username}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-store}_shadow?schema=public"
      REDIS_URL: "${REDIS_URL}"
      CORS_ORIGIN: "${DEV_CORS_ORIGIN:-http://localhost:5173}"
      RUN_PRISMA_GENERATE: "true"
      RUN_DB_PUSH: "${AUTO_DB_PUSH:-false}"
      RUN_DB_MIGRATIONS: "false"
      BACKEND_START_COMMAND: "npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./.env.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: "${VITE_API_URL:-http://localhost:3001}"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
