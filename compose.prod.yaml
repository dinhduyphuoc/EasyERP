services:
  db:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

  redis:

  backend:
    image: "${EASYERP_BACKEND_IMAGE:-easyerp-backend:latest}"
    env_file:
      - ./.env.prod
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: "${REDIS_URL}"
      CORS_ORIGIN: "${PROD_CORS_ORIGIN}"
      RUN_PRISMA_GENERATE: "false"
      RUN_DB_PUSH: "false"
      RUN_DB_MIGRATIONS: "${RUN_DB_MIGRATIONS}"
      RUN_DB_SEED: "${RUN_DB_SEED}"
      BACKEND_START_COMMAND: "npm run start"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: "${EASYERP_FRONTEND_IMAGE:-easyerp-frontend:latest}"
    ports:
      - "${PROD_FRONTEND_PORT}:80"
