name: easyerp

services:
  database:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-store}
    volumes:
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-username} -d ${POSTGRES_DB:-store}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      target: dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_PROFILE: development
      DATABASE_DEVELOPMENT_URL: ${DATABASE_DEVELOPMENT_URL:-postgresql://username:password@database:5432/store?schema=public}
      DATABASE_DEVELOPMENT_SHADOW_URL: ${DATABASE_DEVELOPMENT_SHADOW_URL:-postgresql://username:password@database:5432/store_shadow?schema=public}
      DATABASE_PRODUCTION_REGION: ${DATABASE_PRODUCTION_REGION:-ap-southeast-2}
      DATABASE_PRODUCTION_HOST: ${DATABASE_PRODUCTION_HOST:-database}
      DATABASE_PRODUCTION_PORT: ${DATABASE_PRODUCTION_PORT:-5432}
      DATABASE_PRODUCTION_NAME: ${DATABASE_PRODUCTION_NAME:-store}
      DATABASE_PRODUCTION_USER: ${DATABASE_PRODUCTION_USER:-username}
      DATABASE_PRODUCTION_PASSWORD: ${DATABASE_PRODUCTION_PASSWORD:-password}
      DATABASE_PRODUCTION_SCHEMA: ${DATABASE_PRODUCTION_SCHEMA:-public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${DEV_CORS_ORIGIN:-http://localhost:5173}
      AUTO_DB_PUSH: "false"
    command: >
      sh -c "npx prisma generate &&
      if [ \"$${AUTO_DB_PUSH}\" = \"true\" ]; then npm run db:push; fi &&
      npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      backend-dev:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: "true"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_PROFILE: production
      DATABASE_DEVELOPMENT_URL: ${DATABASE_DEVELOPMENT_URL:-postgresql://username:password@database:5432/store?schema=public}
      DATABASE_DEVELOPMENT_SHADOW_URL: ${DATABASE_DEVELOPMENT_SHADOW_URL:-postgresql://username:password@database:5432/store_shadow?schema=public}
      DATABASE_PRODUCTION_REGION: ${DATABASE_PRODUCTION_REGION:-ap-southeast-2}
      DATABASE_PRODUCTION_HOST: ${DATABASE_PRODUCTION_HOST:-database}
      DATABASE_PRODUCTION_PORT: ${DATABASE_PRODUCTION_PORT:-5432}
      DATABASE_PRODUCTION_NAME: ${DATABASE_PRODUCTION_NAME:-store}
      DATABASE_PRODUCTION_USER: ${DATABASE_PRODUCTION_USER:-username}
      DATABASE_PRODUCTION_PASSWORD: ${DATABASE_PRODUCTION_PASSWORD:-password}
      DATABASE_PRODUCTION_SCHEMA: ${DATABASE_PRODUCTION_SCHEMA:-public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${PROD_CORS_ORIGIN:-http://localhost:8080}
      AUTO_DB_PUSH: ${AUTO_DB_PUSH:-false}
    command: >
      sh -c "npx prisma generate &&
      if [ \"$${AUTO_DB_PUSH}\" = \"true\" ]; then npm run db:push; fi &&
      npm run start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROD_FRONTEND_PORT:-8080}:80"

volumes:
  backend_node_modules:
  frontend_node_modules:
